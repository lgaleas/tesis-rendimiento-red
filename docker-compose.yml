
services:
  fastapi:
    build: ./services/fastapi
    container_name: fastapi_backend
    depends_on:
      - mock_io
    ports:
      - "8000:8000"
    environment:
      - HASH_ITERATIONS=8000
    cpuset: "2"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - benchmark_net
    cap_add:
      - NET_ADMIN

  express:
    build: ./services/express
    container_name: express_backend
    depends_on:
      - mock_io
    ports:
      - "3000:3000"
    environment:
      - HASH_ITERATIONS=8000
      - NODE_OPTIONS=--max-old-space-size=200
    cpuset: "1"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - benchmark_net
    cap_add:
      - NET_ADMIN

  mock_io:
    image: nginx:1.27.4-alpine
    container_name: mock_backend
    cpuset: "4,12"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - benchmark_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 256M

networks:
  benchmark_net:
    name: benchmark_net
    driver: bridge